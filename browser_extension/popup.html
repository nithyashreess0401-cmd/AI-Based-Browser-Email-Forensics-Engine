
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forensic Engine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      padding: 16px;
      color: #172033;
    }
    h2 { margin-top: 0; }
    label { display: block; margin-top: 12px; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 9px;
      margin-top: 5px;
    }
    button {
      margin-top: 16px;
      cursor: pointer;
      background: #174ea6;
      color: white;
      border: 0;
      border-radius: 5px;
    }
    #status { white-space: pre-wrap; margin-top: 12px; }
  </style>
</head>
<body>
  <h2>🛡️ Forensic Engine</h2>
  <p>Select dates in the Streamlit app, create a session, then paste its short-lived token here.</p>\n  <label for="sessionToken">Streamlit session token</label>\n  <input type="text" id="sessionToken" placeholder="Paste token from Streamlit" required>

  <label for="startDate">Start date</label>
  <input type="date" id="startDate" required>

  <label for="endDate">End date</label>
  <input type="date" id="endDate" required>

  <button id="analyse">Retrieve Browser History</button>
  <div id="status" role="status"></div>

  <script src="popup.js"></script>
</body>
</html>
